<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKS Öğrenci Takip Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const SUPABASE_URL = 'https://mksvpawdyyrtabittrzx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_VY32lTPPgeo0pHthJmAtKw_cs1-lwCn';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- Auth Ekranı ve Butonlar dahil tüm yapı ---
        function AuthScreen() {
          const [isLogin, setIsLogin] = useState(true);
          const [email, setEmail] = useState('');
          const [password, setPassword] = useState('');
          const [error, setError] = useState(null);
          const [loading, setLoading] = useState(false);

          const handleAuth = async (e) => {
            e.preventDefault();
            setLoading(true);
            setError(null);
            try {
              if (isLogin) {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
              } else {
                const { error } = await supabase.auth.signUp({ email, password });
                if (error) throw error;
                alert("Kayıt başarılı! Lütfen giriş yapın.");
                setIsLogin(true);
              }
            } catch (err) {
              setError(err.message);
            } finally {
              setLoading(false);
            }
          };

          const handleGoogleSignIn = async () => {
            setLoading(true);
            const { error } = await supabase.auth.signInWithOAuth({ provider: 'google' });
            if (error) setError(error.message);
            setLoading(false);
          };

          return (
            <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
              <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
                <h2 className="text-2xl font-bold text-center mb-6">{isLogin ? 'Panele Giriş' : 'Kayıt Ol'}</h2>
                <form onSubmit={handleAuth} className="space-y-4">
                  <input type="email" placeholder="E-posta" className="w-full border rounded-lg px-4 py-3" value={email} onChange={e => setEmail(e.target.value)} />
                  <input type="password" placeholder="Şifre" className="w-full border rounded-lg px-4 py-3" value={password} onChange={e => setPassword(e.target.value)} />
                  {error && <p className="text-red-500 text-sm">{error}</p>}
                  <button type="submit" className="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold">{isLogin ? 'Giriş Yap' : 'Kayıt Ol'}</button>
                  
                  <div className="text-center text-sm text-slate-400">veya</div>
                  
                  <button type="button" onClick={handleGoogleSignIn} className="w-full bg-white border border-slate-300 py-3 rounded-lg font-bold flex items-center justify-center gap-2 hover:bg-slate-50">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-5 h-5" />
                    Google ile Giriş Yap
                  </button>
                </form>
                <button onClick={() => setIsLogin(!isLogin)} className="w-full mt-4 text-indigo-600 text-sm font-bold">
                  {isLogin ? 'Hesabın yok mu? Kayıt ol' : 'Giriş yap'}
                </button>
              </div>
            </div>
          );
        }

        // Ana App bileşeni ve mantığı buraya gelecek
        function App() {
          const [session, setSession] = useState(null);
          useEffect(() => {
            supabase.auth.getSession().then(({ data: { session } }) => setSession(session));
            supabase.auth.onAuthStateChange((_event, session) => setSession(session));
          }, []);

          if (!session) return <AuthScreen />;
          return <div className="p-10 text-center text-2xl font-bold">Panele Hoşgeldiniz!</div>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
