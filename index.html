                    lucide.createIcons({
                        icons: { [name]: lucide.icons[name] },
                        nameAttr: 'data-lucide',
                        attrs: {
                            class: `lucide lucide-${name} ${className}`,
                            width: size,
                            height: size,
                            stroke: 'currentColor',
                            'stroke-width': 2,

        // ==========================================
        // GİRİŞ / KAYIT EKRANI BİLEŞENİ

        function AuthScreen() {
          const [isLogin, setIsLogin] = useState(true);
          const [email, setEmail] = useState('');
          const [password, setPassword] = useState('');
          const [error, setError] = useState(null);
          const [loading, setLoading] = useState(false);

          const handleAuth = async (e) => {
            e.preventDefault();
            setLoading(true);
            setError(null);
            
            try {
              if (isLogin) {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
              } else {
                const { error } = await supabase.auth.signUp({ email, password });
                if (error) throw error;
                alert("Kayıt başarılı! Lütfen giriş yapın.");
                setIsLogin(true);
              }
            } catch (err) {
              setError(err.message === "Invalid login credentials" ? "E-posta veya şifre hatalı." : err.message);
            } finally {
              setLoading(false);
            }
          };

          return (
            <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4 font-sans">
              <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100 animate-in">

                  {isLogin ? 'Öğrencilerinizi takip etmek için giriş yapın.' : 'Uzman hesabınızı oluşturun.'}
                </p>

                <form onSubmit={handleAuth} className="space-y-4">
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">E-posta</label>
                    <input type="email" required value={email} onChange={e => setEmail(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 outline-none focus:border-indigo-500 transition-colors" placeholder="ornek@mail.com" />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">Şifre</label>
                    <input type="password" required value={password} onChange={e => setPassword(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 outline-none focus:border-indigo-500 transition-colors" placeholder="••••••••" />
                  </div>
                  
                  {error && <div className="text-red-500 text-sm font-medium bg-red-50 p-3 rounded-lg border border-red-100">{error}</div>}

                  <button type="submit" disabled={loading}
                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow-md transition-colors disabled:opacity-50">
                    {loading ? 'İşleniyor...' : (isLogin ? 'Giriş Yap' : 'Kayıt Ol')}
                  </button>
                </form>

                <div className="mt-6 text-center">
                  <button onClick={() => {setIsLogin(!isLogin); setError(null);}} className="text-indigo-600 text-sm font-bold hover:text-indigo-800 transition-colors">
                    {isLogin ? 'Hesabınız yok mu? Kayıt Olun' : 'Zaten hesabınız var mı? Giriş Yapın'}
                  </button>
                </div>
              </div>
            </div>
          );
        }

        // ==========================================
        // ANA BİLEŞEN (EĞİTMEN PANELİ YÖNETİMİ)
        // ==========================================
        function App() {
          const [session, setSession] = useState(null);
          const [students, setStudents] = useState([]);
          const [activeStudentId, setActiveStudentId] = useState(null);
          const [isDataLoading, setIsDataLoading] = useState(true);
          const debounceRef = useRef(null);

          // Oturum ve Veri Çekme
          useEffect(() => {
            supabase.auth.getSession().then(({ data: { session } }) => {
              setSession(session);
              if (session) fetchStudents(session.user.id);
              else setIsDataLoading(false);
            });

            const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
              setSession(session);
              if (session) fetchStudents(session.user.id);
              else setStudents([]);
            });

            return () => subscription.unsubscribe();
          }, []);

          const fetchStudents = async (userId) => {
            setIsDataLoading(true);
            const { data, error } = await supabase.from('students').select('*').order('created_at', { ascending: false });
            if (!error && data) {
              setStudents(data.map(row => row.panel_data));
            }
            setIsDataLoading(false);
          };

          const handleLogout = async () => {
            await supabase.auth.signOut();
          };

          // Supabase'e fazla istek atmamak için arka planda sessizce (1 saniye gecikmeli) kaydeder
          const handleUpdateStudent = (updatedStudent) => {
            setStudents(prev => prev.map(s => s.id === updatedStudent.id ? updatedStudent : s));
            
            if (debounceRef.current) clearTimeout(debounceRef.current);
            debounceRef.current = setTimeout(async () => {
              const { error } = await supabase.from('students')
                .update({ panel_data: updatedStudent, name: updatedStudent.name })
                .eq('student_id', updatedStudent.id);
              if(error) console.error("Güncelleme hatası", error);
            }, 1000);
          };

          const handleAddStudent = async (name) => {
            if (!name.trim()) return;
            const newStudent = getNewStudentData(name);
            setStudents([...students, newStudent]);

            const { error } = await supabase.from('students').insert({
              user_id: session.user.id,
              student_id: newStudent.id,
              name: newStudent.name,
              panel_data: newStudent
            });
            if(error) console.error("Ekleme hatası", error);
          };

          const handleDeleteStudent = async (id) => {
            if (window.confirm("Bu öğrencinin tüm verileri silinecek. Emin misiniz?")) {
              setStudents(prev => prev.filter(s => s.id !== id));
              const { error } = await supabase.from('students').delete().eq('student_id', id);
              if(error) console.error("Silme hatası", error);
            }
          };

          const handleImportData = async (importedData) => {
            if (window.confirm("Mevcut verileriniz tamamen silinip yerine yüklediğiniz dosyadaki veriler getirilecek. Emin misiniz?")) {
              setStudents(importedData);
              // Önce buluttaki eskileri sil
              await supabase.from('students').delete().eq('user_id', session.user.id);
              // Yenileri ekle
              const inserts = importedData.map(s => ({
                  user_id: session.user.id,
                  student_id: s.id,
                  name: s.name,
                  panel_data: s
              }));
              await supabase.from('students').insert(inserts);
              alert("Veriler başarıyla yüklendi!");
            }
          };

          if (!session) return <AuthScreen />;
          
          if (isDataLoading) return (
             <div className="min-h-screen flex flex-col items-center justify-center font-bold text-indigo-500 bg-slate-50 gap-4">
               <RefreshCw className="animate-spin" size={32} /> Verileriniz buluttan getiriliyor...
             </div>
          );

          if (activeStudentId) {
            const activeStudent = students.find(s => s.id === activeStudentId);
            if (!activeStudent) {
              setActiveStudentId(null);
              return null;
            }
            return (
              <StudentDetail 
                key={activeStudent.id} 
                student={activeStudent} 
                onUpdate={handleUpdateStudent} 
                onBack={() => setActiveStudentId(null)} 
              />
            );
          }

          return <CoachDashboard 
                   students={students} 
                   onAdd={handleAddStudent} 
                   onDelete={handleDeleteStudent} 
                   onSelect={setActiveStudentId} 
                   onImport={handleImportData}
                   onLogout={handleLogout}
                 />;
        }

        // ==========================================
        // BİLEŞEN 1: KOÇLUK EKRANI (DASHBOARD)
        // ==========================================
        function CoachDashboard({ students, onAdd, onDelete, onSelect, onImport, onLogout }) {
          const [newName, setNewName] = useState('');
          const fileInputRef = useRef(null);

          const handleExport = () => {
            const dataStr = JSON.stringify(students);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = `yks_takip_yedek_${new Date().toISOString().slice(0,10)}.json`;
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
          };

          const handleFileChange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const parsed = JSON.parse(event.target.result);
                if (Array.isArray(parsed)) onImport(parsed);
                else alert("Geçersiz yedek dosyası!");
              } catch (err) {
                alert("Dosya okuma hatası! Lütfen geçerli bir yedek dosyası seçin.");
              }
            };
            reader.readAsText(file);
            e.target.value = ''; 
          };

          return (
            <div className="min-h-screen bg-slate-50 p-6 md:p-12 font-sans text-slate-800 animate-in">

                      <p className="text-slate-500">Öğrencilerinin tüm ilerlemelerini tek ekrandan yönet.</p>
                    </div>
                  </div>
                  
                  {/* YEDEKLEME VE ÇIKIŞ BUTONLARI */}

                      <Upload size={16} /> Yedeği Yükle
                    </button>
                    <button onClick={handleExport} className="flex-1 md:flex-none flex items-center justify-center gap-2 bg-indigo-50 border border-indigo-200 text-indigo-700 px-4 py-2 rounded-lg font-bold hover:bg-indigo-100 transition-colors shadow-sm text-sm">
                      <Download size={16} /> Yedekle (İndir)
                    </button>
                    <button onClick={onLogout} className="flex-1 md:flex-none flex items-center justify-center gap-2 bg-red-50 border border-red-200 text-red-600 px-4 py-2 rounded-lg font-bold hover:bg-red-100 transition-colors shadow-sm text-sm">
                      <LogOut size={16} /> Çıkış Yap
                    </button>
                  </div>
                </div>

                {/* Öğrenci Ekleme Formu */}
                <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex gap-3 mb-8">
                  <input 
                    value={newName} 
                    onChange={(e) => setNewName(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter') { onAdd(newName); setNewName(''); } }}
                    placeholder="Yeni Öğrenci Adı Soyadı..." 
                    className="flex-1 bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 outline-none focus:border-indigo-400 focus:bg-white transition-colors"
                  />
                  <button 
                    onClick={() => { onAdd(newName); setNewName(''); }}
                    className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-bold flex items-center gap-2 transition-colors shadow-sm"
                  >
                    <Plus size={18} /> Öğrenci Ekle
                  </button>
                </div>

                {/* Öğrenci Listesi Grid */}
                {students.length === 0 ? (
                  <div className="text-center py-20 bg-white rounded-xl border border-slate-200 border-dashed">
                    <Users size={48} className="mx-auto text-slate-300 mb-4" />
                    <h3 className="text-xl font-bold text-slate-600 mb-2">Henüz Öğrenci Yok</h3>
                    <p className="text-slate-500">Yukarıdaki alanı kullanarak takip edeceğiniz öğrencileri ekleyebilirsiniz.</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {students.map(student => {
                      // Özet Veri Hesaplamaları
                      const lastTyt = student.netScores.filter(n => n.type === 'TYT').slice(-1)[0]?.score || '-';
                      const lastAyt = student.netScores.filter(n => n.type === 'AYT').slice(-1)[0]?.score || '-';
                      const finishedSubjects = student.subjects.filter(s => s.status === 'done').length;
                      
                      return (
                        <div key={student.id} className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 hover:shadow-md transition-shadow relative group">
                          <div className="flex justify-between items-start mb-4">
                            <h3 className="text-xl font-bold text-slate-800">{student.name}</h3>
                            <button 
                              onClick={() => onDelete(student.id)}

                              title="Öğrenciyi Sil"
                            >
                              <Trash2 size={18} />
                            </button>
                          </div>
                          
                          <div className="grid grid-cols-2 gap-4 mb-6">
                            <div className="bg-blue-50 p-3 rounded-xl border border-blue-100">

                          <div className="flex items-center gap-2 text-sm text-slate-500 mb-6">
                            <CheckSquare size={16} className="text-green-500" />
                            <span>Toplam <strong>{finishedSubjects}</strong> konu bitirildi.</span>

                          <button

                          >
                            Öğrenci Profilini Aç <ArrowRightCircle size={18} />
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Öğrenci Karşılaştırma Tablosu */}
                {students.length > 0 && (
                  <div className="mt-12 bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <h3 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                      <BarChart2 size={24} className="text-indigo-600" /> Öğrenci Karşılaştırma Tablosu
                    </h3>
                    <div className="overflow-x-auto">
                      <table className="w-full text-sm text-left">
                        <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                          <tr>
                            <th className="px-6 py-4 font-bold">Öğrenci</th>
                            <th className="px-6 py-4 font-bold">Son TYT</th>
                            <th className="px-6 py-4 font-bold">Son AYT</th>
                            <th className="px-6 py-4 font-bold">Biten Konu</th>
                            <th className="px-6 py-4 font-bold">Günlük Soru Hedefi</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {students.map(s => {
                            const lastTyt = s.netScores.filter(n => n.type === 'TYT').slice(-1)[0]?.score || '-';
                            const lastAyt = s.netScores.filter(n => n.type === 'AYT').slice(-1)[0]?.score || '-';
                            const finishedSubjects = s.subjects.filter(sub => sub.status === 'done').length;
                            return (
                              <tr key={s.id} className="hover:bg-slate-50 transition-colors">
                                <td className="px-6 py-4 font-bold text-slate-700">{s.name}</td>
                                <td className="px-6 py-4"><span className="bg-blue-100 text-blue-700 px-2 py-1 rounded-md font-bold">{lastTyt}</span></td>
                                <td className="px-6 py-4"><span className="bg-red-100 text-red-700 px-2 py-1 rounded-md font-bold">{lastAyt}</span></td>
                                <td className="px-6 py-4 text-green-600 font-medium">{finishedSubjects} Konu</td>
                                <td className="px-6 py-4 text-indigo-600 font-medium">{s.dailyQuestionCount} Soru</td>
                              </tr>
                            )
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        // ==========================================
        // BİLEŞEN 2: ÖĞRENCİ DETAYI (KODUNUZUN BİREBİR AYNISI)
        // ==========================================
        function StudentDetail({ student, onUpdate, onBack }) {
          const [activeTab, setActiveTab] = useState('weekly'); 
          
          const [name, setName] = useState(student.name);
          const [week, setWeek] = useState(student.week);
          const [macroGoals, setMacroGoals] = useState(student.macroGoals);
          const [resources, setResources] = useState(student.resources);
          const [netScores, setNetScores] = useState(student.netScores);
          const [studyHours, setStudyHours] = useState(student.studyHours);
          const [subjects, setSubjects] = useState(student.subjects);
          const [mistakes, setMistakes] = useState(student.mistakes);
          const [revisions, setRevisions] = useState(student.revisions);
          const [dailyPlan, setDailyPlan] = useState(student.dailyPlan);
          const [dailyQuestionCount, setDailyQuestionCount] = useState(student.dailyQuestionCount);
          const [todayStudyHour, setTodayStudyHour] = useState(student.todayStudyHour); 

          // UI İçin Geçici State'ler
          const [resInput, setResInput] = useState({ name: '', subject: 'Matematik', month: '', status: 'not-started' });
          const [netInput, setNetInput] = useState({ type: 'TYT', score: '', date: '' });
          const [netEntryMode, setNetEntryMode] = useState('overall');
          const [detailedNetInput, setDetailedNetInput] = useState({ tyt: { turkce: '', mat: '', sosyal: '', fen: '' }, ayt: { edebiyat: '', mat: '', sos1: '', sos2: '', fen: '' } });
          const [newSubject, setNewSubject] = useState('');
          const [newSubjectCat, setNewSubjectCat] = useState('TYT Türkçe');
          
          const [mistakeCat, setMistakeCat] = useState('TYT Türkçe');
          const [mistakeTopic, setMistakeTopic] = useState('');
          const [mistakeReason, setMistakeReason] = useState('Bilgi Eksikliği');
          
          const [revisionInput, setRevisionInput] = useState('');
          const [activeTaskDay, setActiveTaskDay] = useState(null);
          
          const [taskCat, setTaskCat] = useState('TYT Türkçe');
          const [taskTopic, setTaskTopic] = useState('');
          const [taskDesc, setTaskDesc] = useState('');
          
          const [showAllNets, setShowAllNets] = useState(false); 
          const [chartType, setChartType] = useState('bar'); // 'bar' | 'line'

          const [subjectTypeFilter, setSubjectTypeFilter] = useState('TYT'); // YENİ: TYT/AYT/YDT filtresi
          
          const [pomodoroTime, setPomodoroTime] = useState(25 * 60);
          const [isTimerActive, setIsTimerActive] = useState(false);
          const [timerMode, setTimerMode] = useState('work');
          const days = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];

          useEffect(() => {
            onUpdate({
              id: student.id,
              name, week, mistakes, revisions, dailyPlan, dailyQuestionCount, todayStudyHour, macroGoals, subjects, resources, netScores, studyHours
            });
          }, [name, week, mistakes, revisions, dailyPlan, dailyQuestionCount, todayStudyHour, macroGoals, subjects, resources, netScores, studyHours]);

          useEffect(() => {
            let interval = null;
            if (isTimerActive && pomodoroTime > 0) {
              interval = setInterval(() => { setPomodoroTime(pomodoroTime - 1); }, 1000);
            } else if (pomodoroTime === 0) {
              setIsTimerActive(false);
            }
            return () => clearInterval(interval);
          }, [isTimerActive, pomodoroTime]);

          const formatTime = (seconds) => {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
          };

          const toggleTimer = () => setIsTimerActive(!isTimerActive);
          const resetTimer = () => { setIsTimerActive(false); setPomodoroTime(timerMode === 'work' ? 25 * 60 : 5 * 60); };
          const switchTimerMode = () => {
            const newMode = timerMode === 'work' ? 'break' : 'work';
            setTimerMode(newMode);
            setPomodoroTime(newMode === 'work' ? 25 * 60 : 5 * 60);
            setIsTimerActive(false);
          };

          const categories = ['Genel', ...new Set([...Object.keys(yksKonulari), ...subjects.map(s => s.category)])];

          const addResource = () => {
            if (!resInput.name) return;
            setResources([...resources, { ...resInput, id: Date.now() }]);
            setResInput({ ...resInput, name: '' });
          };
          const updateResourceStatus = (id, status) => setResources(resources.map(r => r.id === id ? { ...r, status } : r));
          const deleteResource = (id) => setResources(resources.filter(r => r.id !== id));

          const addNetScore = () => {
            const entryDate = netInput.date || new Date().toISOString().split('T')[0];
            let newEntry = { id: Date.now(), type: netInput.type, date: entryDate, isDetailed: netEntryMode === 'detailed' };
            if (netEntryMode === 'overall') {
              if (!netInput.score) {
                alert("Lütfen net değerini giriniz.");
                return;
              }
              newEntry.score = parseFloat(netInput.score);
            } else {
              const details = netInput.type === 'TYT' ? detailedNetInput.tyt : detailedNetInput.ayt;
              const total = Object.values(details).reduce((sum, val) => sum + (parseFloat(val) || 0), 0);
              if (total === 0 && !Object.values(details).some(v => v !== '')) {
                alert("Lütfen detaylı netleri giriniz.");
                return;
              }
              newEntry.score = total;
              newEntry.details = { 
                turkce: parseFloat(details.turkce) || 0, mat: parseFloat(details.mat) || 0, sosyal: parseFloat(details.sosyal) || 0, fen: parseFloat(details.fen) || 0,
                edebiyat: parseFloat(details.edebiyat) || 0, sos1: parseFloat(details.sos1) || 0, sos2: parseFloat(details.sos2) || 0
              };
            }
            setNetScores([...netScores, newEntry].sort((a,b) => new Date(a.date) - new Date(b.date)));
            setNetInput({ ...netInput, score: '' });
            setDetailedNetInput({ tyt: { turkce: '', mat: '', sosyal: '', fen: '' }, ayt: { edebiyat: '', mat: '', sos1: '', sos2: '', fen: '' } });
          };
          const deleteNetScore = (id) => setNetScores(netScores.filter(n => n.id !== id));

          const saveStudyHour = () => {
            if(todayStudyHour <= 0) return;
            const today = new Date().toISOString().split('T')[0];
            const existingIndex = studyHours.findIndex(s => s.date === today);
            if (existingIndex >= 0) {
              const updated = [...studyHours];
              updated[existingIndex].hours = todayStudyHour;
              setStudyHours(updated);
            } else {
              setStudyHours([...studyHours, { date: today, hours: todayStudyHour }].slice(-7)); 
            }
            alert("Bugünkü çalışma saati kaydedildi.");
          };

          const addSubject = () => {
            if (!newSubject.trim()) return;
            setSubjects([...subjects, { id: Date.now(), category: newSubjectCat, name: newSubject, status: 'pending' }]);
            setNewSubject('');
          };
          const updateSubjectStatus = (id, newStatus) => setSubjects(subjects.map(s => s.id === id ? { ...s, status: newStatus } : s));
          const removeSubject = (id) => setSubjects(subjects.filter(s => s.id !== id));

          const addMistake = () => {
            if (!mistakeTopic.trim()) return;
            setMistakes([...mistakes, { id: Date.now(), category: mistakeCat, topic: mistakeTopic, reason: mistakeReason }]);
            setMistakeTopic('');
          };
          const removeMistake = (id) => setMistakes(mistakes.filter(m => m.id !== id));
          const moveMistakeToRevision = (mistake) => {
            const catText = mistake.category && mistake.category !== 'Genel' ? `[${mistake.category}] ` : '';
            setRevisions([...revisions, { id: Date.now(), text: `${catText}${mistake.topic} (${mistake.reason}) - Telafi Testi`, done: false }]);
            alert(`${mistake.topic} tekrar listesine eklendi.`);
          };

          const addRevision = () => {
            if (!revisionInput.trim()) return;
            setRevisions([...revisions, { id: Date.now(), text: revisionInput, done: false }]);
            setRevisionInput('');
          };
          const removeRevision = (id) => setRevisions(revisions.filter(r => r.id !== id));

          const addDailyTask = (day, text) => {
            if (!text.trim()) return;
            setDailyPlan(prev => ({ ...prev, [day]: [...(prev[day] || []), { id: Date.now(), text, done: false }] }));
          };
          const submitDailyTask = (day) => {
            let finalTaskText = '';
            const catPrefix = taskCat !== 'Genel' ? `${taskCat} - ` : '';
            if (taskTopic && taskDesc) finalTaskText = `${catPrefix}${taskTopic} (${taskDesc})`;
            else if (taskTopic) finalTaskText = `${catPrefix}${taskTopic}`;
            else if (taskDesc) finalTaskText = taskDesc; 
            else return;
            addDailyTask(day, finalTaskText);
            setTaskTopic(''); setTaskDesc(''); setActiveTaskDay(null);
          };
          const toggleDailyTask = (day, id) => setDailyPlan(prev => ({ ...prev, [day]: prev[day].map(t => t.id === id ? { ...t, done: !t.done } : t) }));
          const removeDailyTask = (day, id) => setDailyPlan(prev => ({ ...prev, [day]: prev[day].filter(t => t.id !== id) }));
          
          const resetSubjectsToDefault = () => {
            if(window.confirm("Konu durumları silinecek ve tüm TYT/AYT/YDT konuları varsayılan olarak yüklenecektir. Emin misiniz?")) {
              setSubjects(defaultSubjectsList);
            }
          };

          const getStatusColor = (status) => {
            switch(status) {
              case 'done': return 'bg-green-100 text-green-700 border-green-200';
              case 'working': return 'bg-yellow-100 text-yellow-700 border-yellow-200';
              case 'review': return 'bg-red-100 text-red-700 border-red-200';
              default: return 'bg-slate-50 text-slate-500 border-slate-200';
            }
          };

          const chartData = showAllNets ? netScores : netScores.slice(-5);

          return (
            <div className="min-h-screen bg-slate-50 font-sans text-slate-800 p-4 md:p-8 print:p-0 print:bg-white animate-in">
              
              {/* ÜST BAR */}
              <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center mb-6 gap-4 print:hidden">
                <div className="flex items-center gap-4">
                  <button onClick={onBack} className="bg-white border border-slate-200 text-slate-600 p-2 rounded-xl shadow-sm hover:bg-slate-100 hover:text-indigo-600 transition-all">
                    <ChevronLeft size={24} />
                  </button>
                  <div>
                    <div className="flex items-center gap-3">
                      <h1 className="text-2xl font-bold text-indigo-900">Öğrenci Dosyası</h1>
                    </div>
                    <p className="text-sm text-slate-500">Düzenlenen: <strong>{name}</strong></p>
                  </div>
                </div>
                
                <div className="flex gap-2">
                  <button onClick={() => window.print()} className="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white hover:bg-indigo-700 rounded-lg shadow-md transition-colors font-bold">
                    <Printer size={18} /> Raporu Yazdır
                  </button>
                </div>
              </div>

              <div className="max-w-7xl mx-auto bg-white shadow-xl rounded-2xl overflow-hidden print:shadow-none print:rounded-none border border-slate-100">
                
                {/* BAŞLIK VE HEDEF TARİHLERİ */}
                <div className="bg-indigo-900 text-white p-6 print:bg-white print:text-black print:border-b-2 print:border-black">
                  <div className="flex flex-col md:flex-row gap-6 mb-6">
                    <div className="flex-1">
                      <label className="block text-xs uppercase opacity-70 mb-1">Öğrenci Adı</label>
                      <input 
                        value={name}
                        onChange={e => setName(e.target.value)}
                        placeholder="Adınızı girin..." 
                        className="w-full bg-transparent text-2xl font-bold placeholder-indigo-300/50 outline-none border-b border-indigo-700 focus:border-white transition-colors print:placeholder-transparent"
                      />
                    </div>
                    <div className="flex-1">
                      <label className="block text-xs uppercase opacity-70 mb-1">Hafta / Hedef Tarih</label>
                      <input 
                        value={week}
                        onChange={e => setWeek(e.target.value)}
                        placeholder="Örn: 1-7 Ocak" 
                        className="w-full bg-transparent text-2xl font-bold placeholder-indigo-300/50 outline-none border-b border-indigo-700 focus:border-white transition-colors print:placeholder-transparent"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-indigo-800/50 p-4 rounded-lg border border-indigo-700 print:bg-white print:border-slate-300 print:text-black">
                    <div>
                      <div className="flex items-center gap-2 mb-1 text-indigo-200 text-xs font-bold uppercase print:text-slate-500">
                        <Flag size={14} /> TYT Bitiş Hedefi
                      </div>

                                  </button>

                            const filteredSubjects = subjects.filter(s => s.category.startsWith(subjectTypeFilter));

                            const doneFiltered = filteredSubjects.filter(s => s.status === 'done').length;
                            const progressPercent = totalFiltered === 0 ? 0 : Math.round((doneFiltered / totalFiltered) * 100);

                              <div className="flex-1 w-full lg:max-w-md bg-slate-50 p-3 rounded-xl border border-slate-200 shadow-sm">

                                </div>
                              </div>
                            );

                                  </div>
                                </div>

                                <th className="p-4 font-bold">Hedef Ay</th>
                                <th className="p-4 font-bold">Durum</th>
                                <th className="p-4 text-right font-bold">İşlem</th>
                              </tr>
                            </thead>
                            <tbody className="bg-white">
                              {resources.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-slate-400 italic">Henüz bir kitap planlamadın. "Şubat'ta Apotemi bitecek" gibi hedefler koy.</td></tr>}
                              {resources.map(r => (
                                <tr key={r.id} className="border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors">
                                  <td className="p-4 font-bold text-slate-700">{r.subject}</td>
                                  <td className="p-4">{r.name}</td>
                                  <td className="p-4"><span className="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-xs font-bold">{r.month || '-'}</span></td>
                                  <td className="p-4">
                                    <select 
                                      className={`text-xs font-bold border rounded-lg p-1.5 outline-none ${r.status === 'finished' ? 'bg-green-100 text-green-700 border-green-200' : r.status === 'in-progress' ? 'bg-yellow-100 text-yellow-700 border-yellow-200' : 'bg-slate-100 text-slate-500 border-slate-200'}`}
                                      value={r.status}
                                      onChange={e => updateResourceStatus(r.id, e.target.value)}
                                    >
                                      <option value="not-started">Başlanmadı</option>
                                      <option value="in-progress">Çözülüyor</option>
                                      <option value="finished">Bitti</option>
                                    </select>
                                  </td>
                                  <td className="p-4 text-right"><button onClick={() => deleteResource(r.id)} className="text-slate-300 hover:text-red-500 transition-colors"><Trash2 size={18}/></button></td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </Card>
                    </div>
                  )}

                  {/* TAB 4: NET TAKİBİ & GELİŞİM */}
                  {activeTab === 'progress' && (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 animate-in">
                      <Card className="border-l-4 border-l-indigo-500 flex flex-col h-[500px]">
                        <SectionTitle icon={TrendingUp} title="Net Takibi (Zoom Out)" color="text-indigo-700" />
                        
                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-4 print:hidden shrink-0 shadow-inner">
                           <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-4">
                              <div className="flex gap-2">
                                 <select className="text-sm border border-slate-200 rounded-lg p-2 outline-none font-bold text-indigo-900 bg-white" value={netInput.type} onChange={e => setNetInput({...netInput, type: e.target.value})}>
                                   <option>TYT</option><option>AYT</option>
                                 </select>
                                 <input type="date" className="text-sm border border-slate-200 rounded-lg p-2 outline-none bg-white font-medium text-slate-600" value={netInput.date} onChange={e => setNetInput({...netInput, date: e.target.value})} />
                              </div>
                              <div className="flex bg-white rounded-lg border border-slate-200 p-1 self-start sm:self-auto shadow-sm">
                                 <button onClick={() => setNetEntryMode('overall')} className={`text-xs px-3 py-1.5 rounded-md transition-colors font-medium ${netEntryMode === 'overall' ? 'bg-indigo-100 text-indigo-700 font-bold' : 'text-slate-500 hover:bg-slate-50'}`}>Toplam</button>
                                 <button onClick={() => setNetEntryMode('detailed')} className={`text-xs px-3 py-1.5 rounded-md transition-colors font-medium ${netEntryMode === 'detailed' ? 'bg-indigo-100 text-indigo-700 font-bold' : 'text-slate-500 hover:bg-slate-50'}`}>Ders Detaylı</button>
                              </div>
                           </div>

                           {netEntryMode === 'overall' ? (
                              <div className="flex gap-2">
                                 <input type="number" step="0.25" className="flex-1 text-sm border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-400 font-bold" placeholder={`${netInput.type} Toplam Net (Örn: 75.5)`} value={netInput.score} onChange={e => setNetInput({...netInput, score: e.target.value})} />
                                 <button onClick={addNetScore} className="bg-indigo-600 text-white px-6 rounded-lg hover:bg-indigo-700 font-bold flex items-center gap-2 transition-colors shadow-sm"><Plus size={18}/> Ekle</button>
                              </div>
                           ) : (
                              <div className="space-y-3">
                                 {netInput.type === 'TYT' ? (
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                                       <input type="number" step="0.25" placeholder="Türkçe" className="text-sm border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-400" value={detailedNetInput.tyt.turkce} onChange={e => setDetailedNetInput({...detailedNetInput, tyt: {...detailedNetInput.tyt, turkce: e.target.value}})} />
                                       <input type="number" step="0.25" placeholder="Matematik" className="text-sm border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-400" value={detailedNetInput.tyt.mat} onChange={e => setDetailedNetInput({...detailedNetInput, tyt: {...detailedNetInput.tyt, mat: e.target.value}})} />
                                       <input type="number" step="0.25" placeholder="Sosyal" className="text-sm border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-400" value={detailedNetInput.tyt.sosyal} onChange={e => setDetailedNetInput({...detailedNetInput, tyt: {...detailedNetInput.tyt, sosyal: e.target.value}})} />
                                       <input type="number" step="0.25" placeholder="Fen" className="text-sm border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-400" value={detailedNetInput.tyt.fen} onChange={e => setDetailedNetInput({...detailedNetInput, tyt: {...detailedNetInput.tyt, fen: e.target.value}})} />
                                    </div>
                                 ) : (
                                    <div className="grid grid-cols-2 lg:grid-cols-3 gap-2">
                                       <input type="number" step="0.25" placeholder="Matematik" className="text-sm border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-400" value={detailedNetInput.ayt.mat} onChange={e => setDetailedNetInput({...detailedNetInput, ayt: {...detailedNetInput.ayt, mat: e.target.value}})} />
                                       <input type="number" step="0.25" placeholder="Edebiyat" className="text-sm border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-400" value={detailedNetInput.ayt.edebiyat} onChange={e => setDetailedNetInput({...detailedNetInput, ayt: {...detailedNetInput.ayt, edebiyat: e.target.value}})} />
                                       <input type="number" step="0.25" placeholder="Sosyal 1" className="text-sm border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-400" value={detailedNetInput.ayt.sos1} onChange={e => setDetailedNetInput({...detailedNetInput, ayt: {...detailedNetInput.ayt, sos1: e.target.value}})} />
                                       <input type="number" step="0.25" placeholder="Sosyal 2" className="text-sm border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-400" value={detailedNetInput.ayt.sos2} onChange={e => setDetailedNetInput({...detailedNetInput, ayt: {...detailedNetInput.ayt, sos2: e.target.value}})} />
                                       <input type="number" step="0.25" placeholder="Fen" className="text-sm border border-slate-200 rounded-lg p-2.5 outline-none focus:border-indigo-400" value={detailedNetInput.ayt.fen} onChange={e => setDetailedNetInput({...detailedNetInput, ayt: {...detailedNetInput.ayt, fen: e.target.value}})} />
                                    </div>
                                 )}
                                 <button onClick={addNetScore} className="w-full bg-indigo-600 text-white py-2.5 rounded-lg hover:bg-indigo-700 text-sm font-bold flex items-center justify-center gap-2 transition-colors shadow-sm"><Plus size={18}/> Detaylı Neti Kaydet</button>
                              </div>
                           )}
                        </div>
                        
                        <div className="space-y-2 overflow-y-auto flex-1 pr-2 custom-scrollbar">
                          {netScores.length === 0 && <div className="text-center text-slate-400 text-sm italic p-8">Henüz deneme verisi girmediniz.</div>}
                          {netScores.map(n => (
                            <div key={n.id} className="flex flex-col p-4 bg-white border border-slate-100 rounded-xl shadow-sm hover:shadow-md transition-shadow group">
                               <div className="flex justify-between items-center">
                                  <div className="flex items-center">
                                     <span className={`text-xs font-black px-3 py-1 rounded-lg mr-3 shadow-sm ${n.type === 'TYT' ? 'bg-blue-100 text-blue-700' : 'bg-red-100 text-red-700'}`}>{n.type}</span>
                                     <span className="font-mono font-bold text-xl text-slate-800">{n.score} <span className="text-xs text-slate-400 font-sans font-normal">NET</span></span>
                                  </div>
                                  <div className="flex items-center gap-4">
                                     <span className="text-sm font-medium text-slate-400">{n.date.split('-').reverse().join('.')}</span>
                                     <button onClick={() => deleteNetScore(n.id)} className="text-slate-300 hover:text-red-500 print:hidden opacity-0 group-hover:opacity-100 transition-opacity"><Trash2 size={18}/></button>
                                  </div>
                               </div>
                               
                               {n.isDetailed && n.details && (
                                  <div className="flex gap-x-4 gap-y-2 text-[11px] text-slate-600 mt-3 pt-3 border-t border-slate-100 flex-wrap">
                                     {n.type === 'TYT' ? (
                                        <>
                                           {n.details.turkce !== 0 && <span><b className="text-slate-800 font-bold">TR:</b> {n.details.turkce}</span>}
                                           {n.details.mat !== 0 && <span><b className="text-slate-800 font-bold">MAT:</b> {n.details.mat}</span>}
                                           {n.details.sosyal !== 0 && <span><b className="text-slate-800 font-bold">SOS:</b> {n.details.sosyal}</span>}
                                           {n.details.fen !== 0 && <span><b className="text-slate-800 font-bold">FEN:</b> {n.details.fen}</span>}
                                        </>
                                     ) : (
                                        <>
                                           {n.details.mat !== 0 && <span><b className="text-slate-800 font-bold">MAT:</b> {n.details.mat}</span>}
                                           {n.details.edebiyat !== 0 && <span><b className="text-slate-800 font-bold">EDB:</b> {n.details.edebiyat}</span>}
                                           {n.details.sos1 !== 0 && <span><b className="text-slate-800 font-bold">SOS1:</b> {n.details.sos1}</span>}
                                           {n.details.sos2 !== 0 && <span><b className="text-slate-800 font-bold">SOS2:</b> {n.details.sos2}</span>}
                                           {n.details.fen !== 0 && <span><b className="text-slate-800 font-bold">FEN:</b> {n.details.fen}</span>}
                                        </>
                                     )}
                                  </div>
                               )}
                            </div>
                          ))}
                        </div>
                      </Card>

                      <div className="space-y-6">
                        <Card className="bg-slate-800 text-white border-none flex flex-col h-[320px] shadow-lg">
                          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 opacity-90 flex-shrink-0 gap-3">
                            <div className="flex items-center gap-2"><TrendingUp size={20} /> <h3 className="font-bold text-lg">Gelişim Grafiği</h3></div>
                            <div className="flex items-center gap-2 self-end sm:self-auto flex-wrap justify-end">
                              <div className="flex bg-slate-900 rounded-lg border border-slate-700 p-1 shadow-inner">
                                 <button onClick={() => setChartType('bar')} className={`text-xs px-3 py-1.5 rounded-md transition-colors font-bold ${chartType === 'bar' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>Sütun</button>
                                 <button onClick={() => setChartType('line')} className={`text-xs px-3 py-1.5 rounded-md transition-colors font-bold ${chartType === 'line' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}>Çizgi</button>
                              </div>
                              <button 
                                onClick={() => setShowAllNets(!showAllNets)} 
                                className={`text-xs font-bold px-3 py-1.5 rounded-lg transition-colors shadow-sm ${showAllNets ? 'bg-indigo-500 hover:bg-indigo-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-200'}`}
                              >
                                {showAllNets ? 'Son 5 Deneme' : 'Tümünü Gör'}
                              </button>
                            </div>
                          </div>
                          
                          {/* GRAFİK ALANI */}
                          {chartType === 'bar' ? (
                              <div className={`flex-1 flex items-end gap-3 p-3 bg-slate-900/60 rounded-xl relative overflow-hidden ${showAllNets ? 'overflow-x-auto justify-start custom-scrollbar' : 'justify-between'}`}>
                                {chartData.map((n, i) => {
                                  const maxScore = n.type === 'TYT' ? 120 : 80; 
                                  return (
                                    <div key={n.id} className={`flex flex-col items-center gap-1 h-full group relative ${showAllNets ? 'min-w-[48px]' : 'flex-1'}`}>
                                      <div className="text-xs font-bold opacity-0 group-hover:opacity-100 transition-opacity absolute -top-5 text-indigo-300 z-10">{n.score}</div>
                                      <div className="w-full flex-1 flex flex-col-reverse justify-start relative rounded-t-md overflow-hidden bg-slate-800/80 border-x border-t border-slate-700 group-hover:bg-slate-700 transition-colors">
                                         {!n.isDetailed ? (
                                            <div 
                                              className={`w-full transition-all duration-500 ${n.type === 'TYT' ? 'bg-gradient-to-t from-blue-600 to-blue-400' : 'bg-gradient-to-t from-red-600 to-red-400'}`} 
                                              style={{ height: `${Math.min(100, Math.max(0, (n.score / maxScore) * 100))}%` }} 
                                              title={`${n.type} Toplam: ${n.score}`}
                                            ></div>
                                         ) : (
                                            n.type === 'TYT' ? (
                                               <>
                                                  {n.details.fen > 0 && <div title={`Fen: ${n.details.fen}`} className="w-full bg-green-500" style={{ height: `${(n.details.fen / maxScore) * 100}%` }}></div>}
                                                  {n.details.sosyal > 0 && <div title={`Sosyal: ${n.details.sosyal}`} className="w-full bg-orange-500" style={{ height: `${(n.details.sosyal / maxScore) * 100}%` }}></div>}
                                                  {n.details.mat > 0 && <div title={`Matematik: ${n.details.mat}`} className="w-full bg-blue-500" style={{ height: `${(n.details.mat / maxScore) * 100}%` }}></div>}
                                                  {n.details.turkce > 0 && <div title={`Türkçe: ${n.details.turkce}`} className="w-full bg-red-500" style={{ height: `${(n.details.turkce / maxScore) * 100}%` }}></div>}
                                               </>
                                            ) : (
                                               <>
                                                  {n.details.fen > 0 && <div title={`Fen: ${n.details.fen}`} className="w-full bg-green-500" style={{ height: `${(n.details.fen / maxScore) * 100}%` }}></div>}
                                                  {n.details.sos2 > 0 && <div title={`Sosyal 2: ${n.details.sos2}`} className="w-full bg-orange-600" style={{ height: `${(n.details.sos2 / maxScore) * 100}%` }}></div>}
                                                  {n.details.sos1 > 0 && <div title={`Sosyal 1: ${n.details.sos1}`} className="w-full bg-yellow-500" style={{ height: `${(n.details.sos1 / maxScore) * 100}%` }}></div>}
                                                  {n.details.edebiyat > 0 && <div title={`Edebiyat: ${n.details.edebiyat}`} className="w-full bg-purple-500" style={{ height: `${(n.details.edebiyat / maxScore) * 100}%` }}></div>}
                                                  {n.details.mat > 0 && <div title={`Matematik: ${n.details.mat}`} className="w-full bg-blue-600" style={{ height: `${(n.details.mat / maxScore) * 100}%` }}></div>}
                                               </>
                                            )
                                         )}
                                      </div>
                                      <div className="text-[9px] font-medium text-slate-400 mt-1 whitespace-nowrap">{n.date.slice(5).replace('-', '.')}</div>
                                    </div>
                                  )
                                })}
                                {netScores.length === 0 && <div className="w-full h-full flex items-center justify-center text-slate-500 text-sm italic">Grafik için deneme verisi girin.</div>}
                              </div>
                          ) : (
                              <div className={`flex-1 p-3 bg-slate-900/60 rounded-xl relative overflow-hidden ${showAllNets ? 'overflow-x-auto custom-scrollbar' : ''}`}>
                                 <div className="relative w-full h-full min-h-[150px]" style={{ minWidth: showAllNets && chartData.length > 6 ? `${chartData.length * 60}px` : '100%' }}>
                                    <svg className="absolute inset-0 w-full h-full overflow-visible pointer-events-none">
                                        {chartData.map((n, i) => {
                                            if (i === 0) return null;
                                            const prev = chartData[i-1];
                                            const prevMax = prev.type === 'TYT' ? 120 : 80;
                                            const currMax = n.type === 'TYT' ? 120 : 80;
                                            
                                            const prevX = chartData.length > 1 ? ((i - 1) / (chartData.length - 1)) * 100 : 50;
                                            const prevY = 10 + ((100 - (prev.score / prevMax) * 100) * 0.8);
                                            
                                            const currX = chartData.length > 1 ? (i / (chartData.length - 1)) * 100 : 50;
                                            const currY = 10 + ((100 - (n.score / currMax) * 100) * 0.8);

                                            const padX = (val) => 5 + (val * 0.9);

                                            return (
                                                <line 
                                                    key={`line-${i}`}
                                                    x1={`${padX(prevX)}%`} y1={`${prevY}%`}
                                                    x2={`${padX(currX)}%`} y2={`${currY}%`}
                                                    stroke="#475569" strokeWidth="2"
                                                    strokeDasharray="4 4"
                                                />
                                            );
                                        })}
                                    </svg>
                                    
                                    {chartData.map((n, i) => {
                                        const maxScore = n.type === 'TYT' ? 120 : 80;
                                        const x = chartData.length > 1 ? (i / (chartData.length - 1)) * 100 : 50;
                                        const y = 10 + ((100 - (n.score / maxScore) * 100) * 0.8);
                                        const padX = 5 + (x * 0.9);

                                        return (
                                            <div 
                                                key={`dot-${n.id}`} 
                                                className={`absolute w-3.5 h-3.5 border-2 border-slate-900 rounded-full transform -translate-x-1/2 -translate-y-1/2 group cursor-pointer z-10 transition-transform hover:scale-150 ${n.type === 'TYT' ? 'bg-blue-500' : 'bg-red-500'}`}
                                                style={{ left: `${padX}%`, top: `${y}%` }}
                                            >
                                               <div className="absolute bottom-full mb-1.5 left-1/2 -translate-x-1/2 bg-white text-slate-900 text-[10px] font-bold px-2 py-1 rounded shadow-lg opacity-0 group-hover:opacity-100 whitespace-nowrap transition-opacity pointer-events-none z-20">
                                                  {n.type}: {n.score}
                                                  {n.isDetailed && (
                                                      <div className="text-[8px] text-slate-500 font-normal mt-0.5 border-t border-slate-200 pt-0.5">
                                                          Detaylar için sütun moduna geç.
                                                      </div>
                                                  )}
                                               </div>
                                               <div className="absolute top-full mt-1.5 left-1/2 -translate-x-1/2 text-[9px] font-medium text-slate-400 whitespace-nowrap pointer-events-none">
                                                  {n.date.slice(5).replace('-', '.')}
                                               </div>
                                            </div>
                                        );
                                    })}
                                    {chartData.length === 0 && <div className="absolute inset-0 flex items-center justify-center text-slate-500 text-sm italic">Grafik için deneme verisi girin.</div>}
                                 </div>
                              </div>
                          )}
                          
                          {/* Grafik Altı Renk Lejantı */}
                          {chartType === 'bar' && (() => {
                            const hasDetailedTyt = chartData.some(n => n.type === 'TYT' && n.isDetailed);
                            const hasDetailedAyt = chartData.some(n => n.type === 'AYT' && n.isDetailed);
                            if (!hasDetailedTyt && !hasDetailedAyt) return null;
                            
                            return (
                              <div className="flex flex-wrap justify-center gap-x-4 gap-y-1.5 text-[9px] font-bold mt-4 pt-3 border-t border-slate-700/50 text-slate-300">
                                 {hasDetailedTyt && (
                                    <>
                                      <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 bg-red-500 rounded-sm"></span> TR</div>
                                      <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 bg-blue-500 rounded-sm"></span> TYT MAT</div>
                                      <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 bg-orange-500 rounded-sm"></span> TYT SOS</div>
                                      <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 bg-green-500 rounded-sm"></span> TYT FEN</div>
                                    </>
                                 )}
                                 {hasDetailedAyt && (
                                    <>
                                      <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 bg-blue-600 rounded-sm"></span> AYT MAT</div>
                                      <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 bg-purple-500 rounded-sm"></span> EDB</div>
                                      <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 bg-yellow-500 rounded-sm"></span> SOS1</div>
                                      <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 bg-orange-600 rounded-sm"></span> SOS2</div>
                                      <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 bg-green-500 rounded-sm"></span> AYT FEN</div>
                                    </>
                                 )}
                              </div>
                            )
                          })()}
                          {chartType === 'line' && chartData.length > 0 && (
                              <div className="flex flex-wrap justify-center gap-x-4 gap-y-1.5 text-[9px] font-bold mt-4 pt-3 border-t border-slate-700/50 text-slate-300">
                                 <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 bg-blue-500 rounded-full"></span> TYT Puanları</div>
                                 <div className="flex items-center gap-1"><span className="w-2.5 h-2.5 bg-red-500 rounded-full"></span> AYT Puanları</div>
                              </div>
                          )}
                        </Card>

                        <Card className="border-l-4 border-l-orange-500 h-[155px]">
                          <SectionTitle icon={Clock} title="Haftalık Tempo" color="text-orange-700" rightElement={<span className="text-[10px] bg-orange-100 text-orange-700 px-2 py-1 rounded font-bold">LİNEER ARTIŞ</span>} />
                          <div className="flex items-end justify-between gap-2 h-16 mt-2">
                            {studyHours.map((s, i) => (
                              <div key={i} className="flex-1 flex flex-col items-center gap-1 group relative h-full justify-end">
                                <div className="w-full bg-orange-200 rounded-t-md group-hover:bg-orange-300 transition-colors relative" style={{ height: `${Math.max(10, Math.min(100, (s.hours / 12) * 100))}%` }}>
                                  <span className="absolute -top-6 left-1/2 -translate-x-1/2 text-[10px] font-black text-orange-700 opacity-0 group-hover:opacity-100 transition-opacity bg-orange-50 px-1 rounded shadow-sm">{s.hours}s</span>
                                </div>
                                <span className="text-[9px] text-slate-400 font-bold">{s.date.slice(5).replace('-', '.')}</span>
                              </div>
                            ))}
                            {studyHours.length === 0 && <div className="text-sm text-slate-400 italic w-full text-center mt-4">Çalışma saati verisi yok.</div>}
                          </div>
                        </Card>
                      </div>

                    </div>
                  )}

                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
