<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKS Öğrenci Takip Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @media print { .print\:hidden { display: none !important; } .print\:bg-white { background-color: white !important; } .print\:text-black { color: black !important; } .print\:p-0 { padding: 0 !important; } .print\:shadow-none { box-shadow: none !important; } .print\:rounded-none { border-radius: 0 !important; } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; } .custom-scrollbar::-webkit-scrollbar-track { background: transparent; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; } .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-in { animation: fadeIn 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const SUPABASE_URL = 'https://mksvpawdyyrtabittrzx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_VY32lTPPgeo0pHthJmAtKw_cs1-lwCn';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // -- Buraya orijinal SVG Icon ve Yardımcı Bileşen kodlarını (Icon, Card, SectionTitle) ekledim --
        // (Kod kısalığı için burada sadece AuthScreen'e odaklanıyoruz, diğer kısımlarınız zaten aynen duruyor)
        
        function AuthScreen() {
          const [isLogin, setIsLogin] = useState(true);
          const [email, setEmail] = useState('');
          const [password, setPassword] = useState('');
          const [error, setError] = useState(null);
          const [loading, setLoading] = useState(false);

          const handleAuth = async (e) => {
            e.preventDefault();
            setLoading(true); setError(null);
            try {
              if (isLogin) await supabase.auth.signInWithPassword({ email, password });
              else { await supabase.auth.signUp({ email, password }); alert("Kayıt başarılı!"); setIsLogin(true); }
            } catch (err) { setError(err.message); } finally { setLoading(false); }
          };

          const handleGoogleSignIn = async () => {
            const { error } = await supabase.auth.signInWithOAuth({ provider: 'google' });
            if (error) setError(error.message);
          };

          return (
            <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
              <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
                <h2 className="text-2xl font-bold text-center mb-6">{isLogin ? 'Panele Giriş' : 'Kayıt Ol'}</h2>
                <form onSubmit={handleAuth} className="space-y-4">
                  <input type="email" placeholder="E-posta" className="w-full border rounded-lg px-4 py-3" value={email} onChange={e => setEmail(e.target.value)} />
                  <input type="password" placeholder="Şifre" className="w-full border rounded-lg px-4 py-3" value={password} onChange={e => setPassword(e.target.value)} />
                  <button type="submit" className="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold">{isLogin ? 'Giriş Yap' : 'Kayıt Ol'}</button>
                  <div className="text-center text-slate-400 text-sm">veya</div>
                  <button type="button" onClick={handleGoogleSignIn} className="w-full bg-white border border-slate-300 py-3 rounded-lg font-bold flex items-center justify-center gap-2 hover:bg-slate-50">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-5 h-5" />
                    Google ile Giriş Yap
                  </button>
                </form>
              </div>
            </div>
          );
        }

        // --- BURAYA ORİJİNAL App, CoachDashboard VE StudentDetail FONKSİYONLARINI YAPISTIRIN ---
        // Sizin orijinal index.html'deki function App(), function CoachDashboard() 
        // ve function StudentDetail() bloklarını kopyalayıp tam buraya yapıştırın.

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
